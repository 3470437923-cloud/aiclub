[package]
name = "aiclub"
version = "0.1.0"
description = "AiClub - dual AI observation chamber"
edition = "2021"
authors = ["Liumorrow"]
license = "MIT"
rust-version = "1.77"

[lib]
name = "aiclub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "native-tls"] }
futures-util = "0.3"
thiserror = "2"
dirs = "6"
toml = "0.9"
libc = "0.2"
similar = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
